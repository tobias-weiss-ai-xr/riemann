# ── Survey / exposition ─────────────────────────────────────────────────────
- query: cat:math.NT AND (abs:"Riemann hypothesis" AND abs:"survey" OR abs:"review"
    OR abs:"overview" OR abs:"introduction")
  category: survey
- query: cat:math.NT AND (abs:"zeta function" AND abs:"survey" OR abs:"history"
    OR abs:"status")
  category: survey
# ── Applications ────────────────────────────────────────────────────────────
- query: cat:math.NT AND (abs:"Riemann hypothesis" AND abs:"cryptography" OR abs:"prime"
    OR abs:"distribution")
  category: application
- query: cat:math-ph AND (abs:"Riemann hypothesis" OR abs:"zeta" OR abs:"random matrix")
  category: application
- query: cat:quant-ph AND (abs:"Riemann hypothesis" OR abs:"zeta zeros" OR abs:"Berry-Keating")
  category: application
# ── Evaluation / computation ────────────────────────────────────────────────
- query: cat:math.NA AND (abs:"Riemann zeta" OR abs:"zeros" OR abs:"computation"
    OR abs:"verification")
  category: evaluation
- query: cat:cs.DS AND (abs:"Riemann" OR abs:"zeta" OR abs:"zero" OR abs:"algorithm")
  category: evaluation
- query: cat:math.NT AND (abs:"explicit formula" OR abs:"approximate functional equation"
    OR abs:"zero-free region")
  category: method
# ── Methods ─────────────────────────────────────────────────────────────────
- query: cat:math.NT AND (abs:"moments of zeta" OR abs:"mean value" OR abs:"subconvexity")
  category: method
- query: cat:math.CA AND (abs:"Riemann zeta" OR abs:"Dirichlet series" OR abs:"Tauberian")
  category: method
