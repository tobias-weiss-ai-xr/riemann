topic:
  name: Riemann Hypothesis & Spectral Number Theory
  short: riemann-research
  description: Research corpus for the Riemann Hypothesis, Cayley graphs of SL(2,F_p),
    spectral gaps, Ramanujan property, Hecke operators, L-functions, and their connections
    through graph theory, dynamical systems, and machine learning.
  openalex_mailto: riemann@graphwiz.ai
taxonomy:
  categories:
  - id: spectral-theory
    display: Spectral Theory & Graphs
    description: Cayley graphs, spectral gaps, Ramanujan property, expander graphs,
      Cheeger constants
  - id: number-theory
    display: Number Theory
    description: L-functions, modular forms, Hecke operators, Galois representations,
      Langlands
  - id: dynam-systems
    display: Dynamical Systems
    description: Transfer operators, Gauss map, Selberg zeta, thermodynamic formalism,
      Mayer identity
  - id: machine-learning
    display: Machine Learning
    description: GNNs, spectral prediction, Hecke eigenvalue learning, L-function
      zero classification, excess mass prediction
  - id: equivalences
    display: RH Equivalences & Bridges
    description: Nyman-Beurling, Hilbert-Pólya, Weil, Granville (Goldbach), Bertini,
      Denjoy, Beurling primes, LH positivity, etc.
  - id: formalization
    display: Proof & Formalization
    description: Lean 4 formalization, mathlib integration, verification, automated
      theorem proving
  - id: survey
    display: Surveys & Exposition
    description: Overview papers, pedagogy, history, status reports
  subcategories:
  - id: cayley-graphs
    display: Cayley Graphs
    category: spectral-theory
    description: SL(2,F_p), PSL(2,F_p), vertex-transitive graphs, generators, eigenvalue
      spectra
  - id: spectral-gaps
    display: Spectral Gaps
    category: spectral-theory
    description: λ₂, Cheeger bound, Laplacian eigenvalues, algebraic connectivity,
      expansion
  - id: ramanujan
    display: Ramanujan Property
    category: spectral-theory
    description: Ramanujan graphs, LPS graphs, optimal spectral gap, Alon-Boppana
      bound, Pizer theorem
  - id: brandt-pizer
    display: Brandt & Pizer Matrices
    category: spectral-theory
    description: Brandt matrices = Hecke operators = adjacency on supersingular isogeny
      graphs
  - id: hecke
    display: Hecke Operators
    category: number-theory
    description: T_p, U_p, Atkin-Lehner, Hecke algebras, eigenvalue statistics, Sato-Tate
  - id: l-functions
    display: L-Functions & Zeta
    category: number-theory
    description: Riemann zeta, Dirichlet L, modular L, Euler products, functional
      equations
  - id: modular-forms
    display: Modular Forms
    category: number-theory
    description: Cusp forms, Eisenstein series, CM forms, newforms, weight 2, Dirichlet
      series
  - id: transfer-operator
    display: Transfer Operators
    category: dynam-systems
    description: L_s operator, Gauss map, Perron-Frobenius, nuclear operators, spectral
      radius
  - id: selberg-zeta
    display: Selberg Zeta & Trace Formulas
    category: dynam-systems
    description: Selberg zeta function, Gutzwiller trace, prime geodesic theorem,
      Efrat identity
  - id: gnn-cayley
    display: GNNs on Cayley Graphs
    category: machine-learning
    description: Spectral gap prediction, GAT, ChebConv, subgraph augmentation, node
      features
  - id: gnn-fullgraph
    display: Full-Graph GNNs
    category: machine-learning
    description: ChebConv, spectral convolution, global pooling, full-graph processing
  - id: ml-hecke
    display: ML on Hecke Traces
    category: machine-learning
    description: ' sklearn, XGBoost, neural networks, Hecke eigenvalue prediction,
      LMFDB data'
  - id: ml-zeros
    display: L-Function Zero Classification
    category: machine-learning
    description: Excess mass, zero spacing distribution, GUE/GOE classification, random
      matrix theory
  - id: nyman-beurling
    display: Nyman-Beurling Criterion
    category: equivalences
    description: Density of shifted fractional part functions in L²(0,1)
  - id: hilbert-polya
    display: Hilbert-Pólya Conjecture
    category: equivalences
    description: Zeros of ζ(s) as eigenvalues of a self-adjoint operator
  - id: weil
    display: Weil Criterion
    category: equivalences
    description: Positivity condition → RH, finite field analogue, André Weil
  - id: granville
    display: Granville / Goldbach-Bridge
    category: equivalences
    description: RH equivalent to averaged Goldbach bound, explicit formula, G(2N)-J(2N)
  - id: lean-foundation
    display: Lean & Mathlib
    category: formalization
    description: Core Lean proofs, mathlib integration, diagrams, category theory
      in Lean
  - id: lean-riemann
    display: Lean Formalization of RH
    category: formalization
    description: SL(2,F_p), Cayley graphs, spectral gaps, Ramanujan property, RH in
      Lean
  - id: verification
    display: Formal Verification
    category: formalization
    description: Hadamard product gap, partial results, open gaps, TODO formalization
      work
